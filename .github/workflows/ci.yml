name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Backend
  backend-quality:
    name: Backend · lint y tipos
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check app tests --output-format=github
      - name: Mypy (tipado estático)
        run: mypy app
      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r app -ll

  backend-tests:
    name: Backend · pruebas (${{ matrix.os }}, py${{ matrix.python }})
    needs: backend-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Unitarias
        run: pytest tests/unit -q --junitxml=reports/junit-unit.xml --cov --cov-report=
      - name: Integración
        run: pytest tests/integration -q --junitxml=reports/junit-integration.xml --cov --cov-append --cov-report=
      - name: API / funcionales
        run: pytest tests/api -q --junitxml=reports/junit-api.xml --cov --cov-append --cov-report=
      - name: Contrato OpenAPI
        run: pytest tests/contract -q --junitxml=reports/junit-contract.xml --cov --cov-append --cov-report=
      - name: Seguridad
        run: pytest tests/security -q --junitxml=reports/junit-security.xml --cov --cov-append --cov-report=
      - name: Regresión (golden files)
        run: pytest tests/regression -q --junitxml=reports/junit-regression.xml --cov --cov-append --cov-report=
      - name: Sistema E2E (API)
        run: pytest tests/e2e -q --junitxml=reports/junit-e2e.xml --cov --cov-append --cov-report=
      - name: Umbral de cobertura (≥ 80 %)
        run: |
          coverage report
          coverage xml -o reports/coverage.xml
      - name: Matriz de requisitos
        if: always()
        run: pytest -q -m "not slow" -p no:cacheprovider --co -q > reports/collected.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports-${{ matrix.os }}-${{ matrix.python }}
          path: backend/reports/
      - name: Resumen
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          echo "## Cobertura backend" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true
          cat reports/requirements-coverage.md >> $GITHUB_STEP_SUMMARY || true

  backend-performance:
    name: Backend · rendimiento y memoria
    needs: backend-quality
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      PDFMAP_PERF_MIN_PAGES_S: "10"
      PDFMAP_PERF_PAGES: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/performance -m slow -s --junitxml=reports/junit-performance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-performance, path: backend/reports/ }

  # ---------------------------------------------------------------- Frontend
  frontend:
    name: Frontend · lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unitarias, componentes y accesibilidad (cobertura ≥ 70 %)
        run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-coverage, path: frontend/coverage/ }
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist/ }

  # ---------------------------------------------------------------- E2E navegador
  e2e:
    name: E2E · Playwright (backend + frontend reales)
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    env:
      PDFMAP_DATA_DIR: ${{ github.workspace }}/e2e-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - name: Levantar backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health && break; sleep 1; done
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            uvicorn.log

  # ---------------------------------------------------------------- Contenedores
  docker:
    name: Docker · build de imágenes
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
      - name: Smoke test del contenedor
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health && break; sleep 2; done
          curl -sf http://localhost:8080/ > /dev/null
          docker compose down
