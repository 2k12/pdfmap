name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    name: Título Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            ci
            build
            chore

  traceability:
    name: Trazabilidad (issue y requisito)
    runs-on: ubuntu-latest
    steps:
      - name: El PR debe vincular un issue y un requisito RF/RNF
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -qiE '(closes|fixes|resolves|refs) #[0-9]+' || { echo "::error::Vincule un issue (Closes #N)"; exit 1; }
          echo "$BODY" | grep -qE 'RN?F-[0-9]{2}' || { echo "::error::Indique el requisito RF-xx/RNF-xx"; exit 1; }

  labeler:
    name: Etiquetas por área
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
